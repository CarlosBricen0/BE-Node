name: Validate backend
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onlyhorse
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: onlyhorse
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U onlyhorse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://onlyhorse:ci-only-disposable@127.0.0.1:5433/onlyhorse?schema=public
      TEST_DATABASE_URL: postgresql://onlyhorse:ci-only-disposable@127.0.0.1:5433/onlyhorse_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker exec ${{ job.services.postgres.id }} createdb --username=onlyhorse onlyhorse_test
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
